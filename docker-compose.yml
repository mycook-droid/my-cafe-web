version: '3.8'

services:
  mycafe:
    build: .
    container_name: mycafe-app
    ports:
      - "5000:5000"
    volumes:
      # Persist database
      - ./order.db:/app/order.db
      # Persist QR codes
      - ./static/qr_codes:/app/static/qr_codes
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=change-this-in-production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mycafe-network

networks:
  mycafe-network:
    driver: bridge

volumes:
  db-data:
  qr-data:
