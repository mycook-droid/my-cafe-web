<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY CAFE | Offline</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #101114;
      color: #f9fafb;
      display: grid;
      min-height: 100vh;
      place-items: center;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      max-width: 420px;
      padding: 1.5rem;
    }
    h1 { margin-top: 0; color: #e17055; }
    p { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>MY CAFE is unavailable right now. Reconnect to place or update your order.</p>
  </div>
</body>
</html>
