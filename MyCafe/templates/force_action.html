<!-- File: templates/admin/force_actions.html -->
{% extends "base.html" %}
{% block content %}

<div class="admin-page">
    <div class="admin-header">
        <h1>⚡ Force Actions</h1>
        <p>Admin override controls for emergency situations</p>
    </div>

    <div class="force-actions-container">
        <!-- Search Order -->
        <div class="search-box">
            <input type="text" id="searchOrder" placeholder="Search by Order ID or Customer Name..." 
                   onkeyup="searchOrders()">
            <button onclick="searchOrders()">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <!-- Orders List -->
        <div class="orders-list" id="ordersList">
            <!-- Orders will be loaded here -->
        </div>

        <!-- Action Panel -->
        <div class="action-panel" id="actionPanel">
            <div class="action-header">
                <h3>Select an order to perform actions</h3>
            </div>
            <div class="action-body" id="actionBody">
                <div class="empty-state">
                    <i class="fas fa-hand-pointer"></i>
                    <p>Select an order from the list to begin</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .admin-page {
        padding: 2rem;
    }

    .admin-header {
        margin-bottom: 2rem;
    }

    .admin-header h1 {
        font-size: 2rem;
        color: var(--primary);
        margin-bottom: 0.5rem;
    }

    .force-actions-container {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 2rem;
    }

    .search-box {
        grid-column: 1 / -1;
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
    }

    .search-box input {
        flex: 1;
        padding: 1rem;
        border: 2px solid var(--primary);
        border-radius: 8px;
        font-size: 1rem;
    }

    .search-box button {
        padding: 1rem 2rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    .orders-list {
        background: white;
        border-radius: 12px;
        border: 1px solid #eee;
        max-height: 600px;
        overflow-y: auto;
    }

    .order-list-item {
        padding: 1rem;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        transition: background 0.2s;
    }

    .order-list-item:hover {
        background: #f8f9fa;
    }

    .order-list-item.selected {
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
    }

    .order-id {
        font-weight: bold;
        color: var(--primary);
    }

    .order-customer {
        color: #666;
        font-size: 0.9rem;
    }

    .order-status {
        display: inline-block;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-size: 0.8rem;
        margin-top: 0.5rem;
    }

    .status-pending { background: #fff3cd; color: #856404; }
    .status-preparing { background: #cce5ff; color: #004085; }
    .status-ready { background: #d4edda; color: #155724; }
    .status-completed { background: #d1ecf1; color: #0c5460; }

    .action-panel {
        background: white;
        border-radius: 12px;
        border: 1px solid #eee;
        overflow: hidden;
    }

    .action-header {
        padding: 1.5rem;
        background: #f8f9fa;
        border-bottom: 1px solid #eee;
    }

    .action-body {
        padding: 1.5rem;
        min-height: 400px;
    }

    .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: #666;
    }

    .empty-state i {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.5;
    }

    .selected-order-info {
        margin-bottom: 1.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 2px solid #eee;
    }

    .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .action-btn {
        padding: 1rem;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: transform 0.2s;
    }

    .action-btn:hover {
        transform: translateY(-2px);
    }

    .btn-complete { background: #28a745; }
    .btn-cancel { background: #dc3545; }
    .btn-paid { background: #17a2b8; }
    .btn-lock { background: #6c757d; }

    .reason-input {
        margin-top: 1rem;
    }

    .reason-input textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-top: 0.5rem;
        font-family: inherit;
    }
</style>

<script>
    let selectedOrder = null;

    async function searchOrders() {
        const query = document.getElementById('searchOrder').value;
        
        try {
            const res = await fetch(`/api/admin/search-orders?q=${encodeURIComponent(query)}`);
            const orders = await res.json();
            
            const list = document.getElementById('ordersList');
            list.innerHTML = '';
            
            if (orders.length === 0) {
                list.innerHTML = '<div class="empty-state">No orders found</div>';
                return;
            }
            
            orders.forEach(order => {
                const div = document.createElement('div');
                div.className = 'order-list-item';
                div.dataset.orderId = order.id;
                div.onclick = () => selectOrder(order);
                
                div.innerHTML = `
                    <div class="order-id">#${order.id}</div>
                    <div class="order-customer">${order.guest_name || order.username || 'Guest'}</div>
                    <div class="order-status status-${order.status}">${order.status}</div>
                    <div>₹${order.total}</div>
                    <div><small>${order.created_at}</small></div>
                `;
                
                list.appendChild(div);
            });
        } catch (error) {
            console.error('Error searching orders:', error);
        }
    }

    function selectOrder(order) {
        // Remove previous selection
        document.querySelectorAll('.order-list-item').forEach(item => {
            item.classList.remove('selected');
        });
        
        // Mark as selected
        event.target.closest('.order-list-item').classList.add('selected');
        
        selectedOrder = order;
        showActionsForOrder(order);
    }

    function showActionsForOrder(order) {
        const panel = document.getElementById('actionBody');
        
        panel.innerHTML = `
            <div class="selected-order-info">
                <h4>Order #${order.id}</h4>
                <p><strong>Customer:</strong> ${order.guest_name || order.username || 'Guest'}</p>
                <p><strong>Total:</strong> ₹${order.total}</p>
                <p><strong>Status:</strong> <span class="status-${order.status}">${order.status}</span></p>
                <p><strong>Items:</strong></p>
                <pre style="background: #f8f9fa; padding: 0.5rem; border-radius: 4px;">${order.items}</pre>
            </div>
            
            <div class="action-buttons">
                ${order.status !== 'completed' ? `
                <button class="action-btn btn-complete" onclick="forceAction('complete', ${order.id})">
                    <i class="fas fa-check-circle"></i> Force Complete
                </button>
                ` : ''}
                
                ${order.status !== 'cancelled' ? `
                <button class="action-btn btn-cancel" onclick="forceAction('cancel', ${order.id})">
                    <i class="fas fa-times-circle"></i> Force Cancel
                </button>
                ` : ''}
                
                ${order.payment_method !== 'paid' ? `
                <button class="action-btn btn-paid" onclick="forceAction('paid', ${order.id})">
                    <i class="fas fa-money-bill-wave"></i> Mark as Paid
                </button>
                ` : ''}
                
                ${order.locked ? `
                <button class="action-btn" onclick="forceAction('unlock', ${order.id})" 
                        style="background: #ffc107;">
                    <i class="fas fa-unlock"></i> Unlock Order
                </button>
                ` : `
                <button class="action-btn btn-lock" onclick="forceAction('lock', ${order.id})">
                    <i class="fas fa-lock"></i> Lock Order
                </button>
                `}
            </div>
            
            <div class="reason-input">
                <label>Reason for action (optional):</label>
                <textarea id="reasonText" placeholder="Enter reason..."></textarea>
            </div>
        `;
    }

    async function forceAction(action, orderId) {
        const reason = document.getElementById('reasonText')?.value || '';
        
        let endpoint = '';
        let payload = {};
        
        switch(action) {
            case 'complete':
                endpoint = `/admin/orders/${orderId}/force-complete`;
                payload = { reason };
                break;
            case 'cancel':
                endpoint = `/admin/orders/${orderId}/force-cancel`;
                payload = { reason };
                break;
            case 'paid':
                endpoint = `/admin/orders/${orderId}/mark-paid`;
                payload = { payment_method: 'cash', reason };
                break;
            case 'lock':
                endpoint = `/admin/orders/${orderId}/lock`;
                payload = { reason: reason || 'admin_locked' };
                break;
            case 'unlock':
                endpoint = `/admin/orders/${orderId}/unlock`;
                break;
        }
        
        if (!confirm(`Are you sure you want to ${action} order #${orderId}?`)) {
            return;
        }
        
        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await res.json();
            
            if (data.success) {
                alert(`Order #${orderId} ${action}ed successfully!`);
                searchOrders(); // Refresh list
                
                // Clear selection
                selectedOrder = null;
                document.getElementById('actionBody').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle" style="color: #28a745;"></i>
                        <p>Action completed successfully!</p>
                        <p>Select another order to continue.</p>
                    </div>
                `;
            } else {
                alert(`Failed: ${data.error}`);
            }
        } catch (error) {
            console.error('Error performing action:', error);
            alert('Failed to perform action');
        }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', searchOrders);
</script>

{% endblock %}
