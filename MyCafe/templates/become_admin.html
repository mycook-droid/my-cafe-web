<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Access | MY CAFE 2050</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        {% if is_admin %}
        <h1 style="color:var(--neon-blue)">ACCESS GRANTED</h1>
        <p class="subtitle">Administrator Privileges Active</p>
        
        <div style="text-align:center; margin: 2rem 0;">
            <i class="fas fa-shield-alt" style="font-size:4rem; color:var(--neon-blue)"></i>
        </div>

        <a href="/admin" class="btn" style="width:100%; display:block; text-align:center;">
            ENTER COMMAND CENTER
        </a>

        {% else %}
        <h1 style="color: #ff4444;">SECURITY CHECK</h1>
        <p class="subtitle">Enter Override Code</p>

        {% if error %}
        <div class="error" style="color:#ff4444; text-align:center; margin-bottom:1rem;">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/become-admin">
            <div class="input-group">
                <input type="password" name="admin_code" placeholder="ENTER CODE..." required style="text-align:center; letter-spacing:5px; font-family:'Orbitron'">
            </div>
            <button type="submit" style="background: #ff4444; color:white;">
                AUTHENTICATE
            </button>
        </form>
        
        <div class="divider">SYSTEM INFO</div>
        <p class="terms">Default Protocol: MYCAFE2024</p>
        
        <div style="margin-top:2rem; text-align:center;">
            <a href="/" style="color:var(--text-muted); text-decoration:none;"><i class="fas fa-arrow-left"></i> ABORT</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
