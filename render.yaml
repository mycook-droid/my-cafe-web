services:
  - type: web
    name: mycafe-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CODE
        value: MYCAFE2024
      - key: PYTHON_VERSION
        value: 3.11.0
