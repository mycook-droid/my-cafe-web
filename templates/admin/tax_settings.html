{% extends "base.html" %}
{% block content %}
<div class="admin-page">
    <div class="admin-header">
        <h1>💰 Tax & Charges Settings</h1>
        <p>Configure GST, service charges, and other fees</p>
    </div>

    {% if request.args.get('success') %}
    <div class="success-alert">
        ✅ Settings updated successfully!
    </div>
    {% endif %}

    <form method="POST" class="settings-form">
        <!-- GST Section -->
        <div class="settings-section">
            <h3><i class="fas fa-receipt"></i> GST Settings</h3>
            <div class="toggle-group">
                <label>
                    <input type="checkbox" name="gst_enabled" {% if settings.gst_enabled %}checked{% endif %}>
                    Enable GST
                </label>
            </div>
            
            <div class="form-group">
                <label>GST Rate (%)</label>
                <input type="number" name="gst_rate" step="0.01" value="{{ settings.gst_rate }}" min="0" max="100">
            </div>
            
            <div class="form-group">
                <label>GST Number</label>
                <input type="text" name="gst_number" value="{{ settings.gst_number }}" placeholder="GSTIN: 29ABCDE1234F1Z5">
            </div>
        </div>

        <!-- Service Charge Section -->
        <div class="settings-section">
            <h3><i class="fas fa-concierge-bell"></i> Service Charge</h3>
            <div class="toggle-group">
                <label>
                    <input type="checkbox" name="service_charge_enabled" {% if settings.service_charge_enabled %}checked{% endif %}>
                    Enable Service Charge
                </label>
            </div>
            
            <div class="form-group">
                <label>Service Charge Rate (%)</label>
                <input type="number" name="service_charge_rate" step="0.01" value="{{ settings.service_charge_rate }}" min="0" max="100">
            </div>
        </div>

        <!-- Other Charges -->
        <div class="settings-section">
            <h3><i class="fas fa-box"></i> Packaging & Delivery</h3>
            
            <div class="toggle-group">
                <label>
                    <input type="checkbox" name="packaging_charge_enabled" {% if settings.packaging_charge_enabled %}checked{% endif %}>
                    Enable Packaging Charge
                </label>
            </div>
            
            <div class="form-group">
                <label>Packaging Charge (₹)</label>
                <input type="number" name="packaging_charge" step="0.01" value="{{ settings.packaging_charge }}" min="0">
            </div>
            
            <div class="toggle-group">
                <label>
                    <input type="checkbox" name="delivery_charge_enabled" {% if settings.delivery_charge_enabled %}checked{% endif %}>
                    Enable Delivery Charge
                </label>
            </div>
            
            <div class="form-group">
                <label>Delivery Charge (₹)</label>
                <input type="number" name="delivery_charge" step="0.01" value="{{ settings.delivery_charge }}" min="0">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Save Settings
        </button>
    </form>
</div>

<style>
.settings-form {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem;
    background: var(--card-light);
    border-radius: 16px;
}

.settings-section {
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 2px solid rgba(225, 112, 85, 0.1);
}

.settings-section h3 {
    font-size: 1.5rem;
    color: var(--primary);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.toggle-group {
    margin-bottom: 1.5rem;
}

.toggle-group label {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-weight: 600;
    color: var(--text-dark);
    cursor: pointer;
    padding: 0.75rem;
    background: rgba(225, 112, 85, 0.05);
    border-radius: 10px;
}

.toggle-group input[type="checkbox"] {
    width: 20px;
    height: 20px;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--text-dark);
}

.form-group input {
    width: 100%;
    padding: 0.875rem 1rem;
    border: 2px solid rgba(225, 112, 85, 0.2);
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s;
}

.form-group input:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(225, 112, 85, 0.1);
}

.success-alert {
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    color: white;
    padding: 1rem 1.5rem;
    border-radius: 10px;
    margin-bottom: 2rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}
</style>
{% endblock %}
