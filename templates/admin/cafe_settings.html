{% extends "base.html" %}
{% block content %}
<section class="admin-settings-page">
    <div class="admin-head">
        <h1><i class="fa-solid fa-store"></i> Cafe Information</h1>
        <p>Update the business details shown to staff/admin users.</p>
    </div>

    <form class="admin-card" method="POST" action="/admin/cafe-settings">
        <label>Cafe Name</label>
        <input type="text" name="cafe_name" value="{{ cafe_settings.cafe_name or '' }}" required>

        <label>Address</label>
        <textarea name="address" rows="3">{{ cafe_settings.address or '' }}</textarea>

        <label>Phone</label>
        <input type="text" name="phone" value="{{ cafe_settings.phone or '' }}">

        <label>Logo URL</label>
        <input type="url" name="logo_url" value="{{ cafe_settings.logo_url or '' }}">

        <div class="actions">
            <a href="/admin/settings" class="ghost-link">Cancel</a>
            <button type="submit"><i class="fa-solid fa-floppy-disk"></i> Save Cafe Info</button>
        </div>
    </form>
</section>

<style>
.admin-settings-page{max-width:760px;margin:0 auto;display:grid;gap:1rem}
.admin-head{padding:1rem 1.1rem;border:1px solid rgba(255,171,46,.28);border-radius:20px;background:linear-gradient(160deg,rgba(255,171,46,.12),rgba(255,171,46,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 34px rgba(0,0,0,.22)}
.admin-head h1{display:flex;align-items:center;gap:.6rem;color:#ffb648;font-size:clamp(1.5rem,4vw,2rem);margin:0 0 .35rem}
.admin-head p{color:#e8c58d;margin:0}
.admin-card{border:1px solid rgba(255,171,46,.28);background:linear-gradient(165deg,rgba(255,171,46,.11),rgba(255,171,46,.04));border-radius:20px;padding:1rem;display:grid;gap:.78rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 34px rgba(0,0,0,.22)}
.admin-card label{font-size:.92rem;font-weight:700;color:#f4d9ae;letter-spacing:.4px}
.admin-card input,.admin-card textarea{width:100%;border:1px solid rgba(255,171,46,.35);background:rgba(27,15,7,.45);color:#fff6e8;border-radius:12px;padding:.74rem .82rem;font-size:1rem;outline:none;transition:border-color .2s, box-shadow .2s}
.admin-card textarea{resize:vertical;min-height:108px}
.admin-card input:focus,.admin-card textarea:focus{border-color:#ffbf59;box-shadow:0 0 0 3px rgba(255,171,46,.2)}
.actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.5rem}
.actions button{width:auto;padding:.74rem 1rem;letter-spacing:.5px;font-size:1rem;border-radius:12px;display:inline-flex;align-items:center;gap:.45rem;background:linear-gradient(135deg,#ff9f2f,#f97316);border:1px solid rgba(255,200,136,.4);box-shadow:0 10px 20px rgba(124,61,12,.35)}
.ghost-link{display:inline-flex;align-items:center;padding:.66rem .9rem;border:1px solid rgba(255,171,46,.35);border-radius:12px;color:#ffddab;text-decoration:none;background:rgba(27,15,7,.3)}
</style>
{% endblock %}
