<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | MY CAFE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-card compact-auth">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue ordering</p>

        {% if message %}
        <div class="success"><i class="fas fa-circle-check"></i> {{ message }}</div>
        {% endif %}
        {% if error %}
        <div class="error"><i class="fas fa-triangle-exclamation"></i> {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" autocomplete="on">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required minlength="3" maxlength="40" autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required minlength="8" autocomplete="current-password">
            </div>
            <button type="submit">Sign In</button>
        </form>

        <p class="auth-link-text">New to MY CAFE? <a href="/signup">Create account</a></p>
        <p class="auth-link-text"><a href="/">← Back to app</a></p>
    </div>
</body>
</html>
