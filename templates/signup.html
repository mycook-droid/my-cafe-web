<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | MY CAFE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background circles */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.12;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: white;
            top: -150px;
            right: -100px;
            animation: rotate 30s linear infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: white;
            bottom: -100px;
            left: -80px;
            animation: rotate 40s linear infinite reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            to { transform: rotate(360deg) scale(1); }
        }

        /* Back button */
        .back-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 10;
        }

        .back-home a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 0.75rem 1.25rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .back-home a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-5px);
        }

        /* Signup container */
        .signup-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 3rem 2.75rem;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
            animation: zoomIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Brand section */
        .brand {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-icon {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 12px 35px rgba(245, 87, 108, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .brand-icon i {
            font-size: 2.2rem;
            color: white;
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .brand p {
            color: #718096;
            font-size: 0.95rem;
        }

        /* Form */
        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            position: relative;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.95rem 1.15rem;
            padding-left: 3rem;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            color: #2d3748;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            background: white;
            border-color: #f093fb;
            box-shadow: 0 0 0 3px rgba(240, 147, 251, 0.12);
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        /* Input icons */
        .input-icon {
            position: absolute;
            left: 1rem;
            bottom: 0.95rem;
            color: #a0aec0;
            font-size: 1.05rem;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-group input:focus ~ .input-icon {
            color: #f093fb;
        }

        /* Password strength indicator */
        .password-strength {
            height: 4px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: all 0.4s ease;
            background: #e53e3e;
        }

        .strength-bar.weak {
            width: 33%;
            background: linear-gradient(135deg, #fc8181, #e53e3e);
        }

        .strength-bar.medium {
            width: 66%;
            background: linear-gradient(135deg, #f6ad55, #ed8936);
        }

        .strength-bar.strong {
            width: 100%;
            background: linear-gradient(135deg, #68d391, #38a169);
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 1.05rem 1.5rem;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.75rem;
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.35);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .submit-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.45);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn span {
            position: relative;
            z-index: 1;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #a0aec0;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider::before {
            margin-right: 1rem;
        }

        .divider::after {
            margin-left: 1rem;
        }

        /* Footer */
        .footer-links {
            text-align: center;
        }

        .footer-links p {
            color: #718096;
            font-size: 0.925rem;
            margin-bottom: 0.75rem;
        }

        .footer-links a {
            color: #f5576c;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #f093fb;
            text-decoration: underline;
        }

        .terms {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-top: 1.25rem;
            line-height: 1.6;
        }

        .terms a {
            color: #718096;
            text-decoration: underline;
        }

        .terms a:hover {
            color: #f5576c;
        }

        /* Loading state */
        .submit-btn.loading {
            pointer-events: none;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            z-index: 2;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .submit-btn.loading span {
            opacity: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 1.25rem;
            }

            .signup-card {
                padding: 2.5rem 2rem;
            }

            .brand h1 {
                font-size: 1.9rem;
            }

            .brand-icon {
                width: 65px;
                height: 65px;
            }

            .brand-icon i {
                font-size: 1.9rem;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-group {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }

            .back-home {
                top: 1rem;
                left: 1rem;
            }

            .signup-card {
                padding: 2rem 1.5rem;
                border-radius: 22px;
            }

            .brand h1 {
                font-size: 1.65rem;
            }

            .brand-icon {
                width: 60px;
                height: 60px;
            }

            .brand-icon i {
                font-size: 1.65rem;
            }

            .form-group input {
                padding: 0.85rem 1rem;
                padding-left: 2.65rem;
                font-size: 0.9rem;
            }

            .input-icon {
                left: 0.85rem;
                bottom: 0.85rem;
                font-size: 0.95rem;
            }

            .submit-btn {
                padding: 0.95rem 1.25rem;
                font-size: 0.95rem;
            }

            .back-home a {
                padding: 0.625rem 1rem;
                font-size: 0.9rem;
            }

            .terms {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="back-home">
        <a href="/">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
    </div>

    <div class="signup-container">
        <div class="signup-card">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fas fa-coffee"></i>
                </div>
                <h1>Join MY CAFE</h1>
                <p>Create your account and start your culinary adventure</p>
            </div>

            <form method="POST" action="/signup" class="signup-form" id="signupForm">
                <div class="form-group full-width">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        name="username" 
                        id="username"
                        placeholder="Choose a unique username" 
                        required
                        autocomplete="username"
                    >
                    <i class="fas fa-user-circle input-icon"></i>
                </div>

                <div class="form-group full-width">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        name="password" 
                        id="password"
                        placeholder="Create a strong password" 
                        required
                        autocomplete="new-password"
                    >
                    <i class="fas fa-key input-icon"></i>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="name">Full Name</label>
                    <input 
                        type="text" 
                        name="name" 
                        id="name"
                        placeholder="Enter your full name" 
                        required
                        autocomplete="name"
                    >
                    <i class="fas fa-id-card input-icon"></i>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input 
                            type="email" 
                            name="email" 
                            id="email"
                            placeholder="your@email.com" 
                            required
                            autocomplete="email"
                        >
                        <i class="fas fa-envelope input-icon"></i>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input 
                            type="tel" 
                            name="phone" 
                            id="phone"
                            placeholder="Your phone number" 
                            required
                            autocomplete="tel"
                        >
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Create My Account</span>
                </button>
            </form>

            <div class="divider">ALREADY HAVE AN ACCOUNT?</div>

            <div class="footer-links">
                <p>
                    Ready to dine?
                    <a href="/login">Sign in here</a>
                </p>

                <p class="terms">
                    By creating an account, you agree to our
                    <a href="/terms">Terms of Service</a> and
                    <a href="/privacy">Privacy Policy</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        const submitBtn = signupForm.querySelector('.submit-btn');

        // Password strength checker
        passwordInput.addEventListener('input', function(e) {
            const password = e.target.value;
            let strength = 0;

            // Reset classes
            strengthBar.className = 'strength-bar';

            if (password.length === 0) {
                return;
            }

            // Check criteria
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            // Set strength class
            if (strength <= 2) {
                strengthBar.classList.add('weak');
            } else if (strength <= 4) {
                strengthBar.classList.add('medium');
            } else {
                strengthBar.classList.add('strong');
            }
        });

        // Form submission
        signupForm.addEventListener('submit', function(e) {
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
        });

        // Auto-focus first input
        window.addEventListener('load', () => {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
