<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | MY CAFE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <style>
:root {
  --bg: #070809;
  --bg-2: #0f1113;
  --surface: rgba(255,255,255,0.04);
  --surface-2: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --border-hi: rgba(232,255,0,0.35);
  --text: #eef1e8;
  --muted: #6b7267;
  --accent: #d6f500;
  --accent-2: rgba(214,245,0,0.12);
  --green: #00e87a;
  --red: #ff4d4d;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
}

main {
  max-width: min(100%, 600px);
  margin: 0 auto;
  padding: 20px 16px;
  position: relative;
  z-index: 1;
}

label,
small,
.badge,
.bottom-nav a,
.mobile-app-nav a,
.mobile-app-nav .app-nav-btn,
.nav-tab,
.tab,
.meta,
[class*='meta'] {
  font-family: 'Space Mono', monospace;
  text-transform: uppercase;
}

h1,
h2,
.hero-title,
.display,
[class*='hero'] h1,
[class*='hero'] h2 {
  font-family: 'Bebas Neue', sans-serif;
}

.card,
.panel,
section,
.split-card,
.preset-card,
.exercise-item,
[class*='card'] {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  transition: border-color 0.2s, transform 0.18s;
}

.card:hover,
.panel:hover,
section:hover,
.split-card:hover,
.preset-card:hover,
.exercise-item:hover,
[class*='card']:hover {
  border-color: var(--border-hi);
  transform: translateY(-2px);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

main > section,
main > div {
  animation: cardIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
}

main > section:nth-child(1), main > div:nth-child(1) { animation-delay: 0s; }
main > section:nth-child(2), main > div:nth-child(2) { animation-delay: 0.07s; }
main > section:nth-child(3), main > div:nth-child(3) { animation-delay: 0.14s; }
main > section:nth-child(4), main > div:nth-child(4) { animation-delay: 0.21s; }

.skeleton {
  border-radius: 14px;
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.6s ease-in-out infinite;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.bottom-nav,
.mobile-app-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  background: rgba(7,8,9,0.92);
  backdrop-filter: blur(28px);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
}

.bottom-nav a,
.mobile-app-nav a,
.mobile-app-nav .app-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px 4px;
  border-radius: 14px;
  color: var(--muted);
  text-decoration: none;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color 0.2s, background 0.2s;
}

.bottom-nav a svg,
.mobile-app-nav a svg,
.mobile-app-nav .app-nav-btn svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.bottom-nav a.active,
.mobile-app-nav a.active,
.mobile-app-nav .app-nav-btn.active {
  color: var(--accent);
  background: var(--accent-2);
}

button,
.btn-primary,
input[type='submit'],
input[type='button'] {
  background: var(--accent);
  color: #080a05;
  border: none;
  border-radius: 14px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  padding: 14px;
  width: 100%;
  cursor: pointer;
  transition: filter 0.2s, transform 0.12s;
}

button:hover,
.btn-primary:hover,
input[type='submit']:hover,
input[type='button']:hover {
  filter: brightness(1.08);
}

button:active,
.btn-primary:active,
input[type='submit']:active,
input[type='button']:active {
  transform: scale(0.97);
}

input,
textarea,
select {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  padding: 13px 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--border-hi);
  box-shadow: 0 0 0 3px rgba(214,245,0,0.08);
}
</style>
</head>
<body class="auth-body">
    <div class="auth-card signup-card compact-auth auth-premium">
        <div class="auth-brand">
            <div class="auth-brand-icon"><i class="fas fa-coffee"></i></div>
            <h1>Create Account</h1>
            <p class="subtitle">Join MY CAFE in less than a minute</p>
        </div>

        {% if error %}
        <div class="error"><i class="fas fa-triangle-exclamation"></i> {{ error }}</div>
        {% endif %}

        <form method="POST" action="/signup" autocomplete="on">
            <input type="text" name="username" placeholder="Username" required minlength="3" maxlength="40" autocomplete="username">
            <input type="password" name="password" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="new-password">
            <input type="text" name="name" placeholder="Full Name" required maxlength="80" autocomplete="name">
            <input type="email" name="email" placeholder="Email" required maxlength="120" autocomplete="email">
            <input type="tel" name="phone" placeholder="Phone" required minlength="8" maxlength="20" autocomplete="tel">
            <button type="submit">Create Account</button>
        </form>

        <p class="auth-link-text">Already have an account? <a href="/login">Sign in</a></p>
        <p class="auth-link-text"><a href="/">← Back to app</a></p>
    </div>
</body>
</html>
