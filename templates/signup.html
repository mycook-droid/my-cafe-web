<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | MY CAFE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-card signup-card compact-auth auth-premium">
        <div class="auth-brand">
            <div class="auth-brand-icon"><i class="fas fa-coffee"></i></div>
            <h1>Create Account</h1>
            <p class="subtitle">Join MY CAFE in less than a minute</p>
        </div>

        {% if error %}
        <div class="error"><i class="fas fa-triangle-exclamation"></i> {{ error }}</div>
        {% endif %}

        <form method="POST" action="/signup" autocomplete="on">
            <input type="text" name="username" placeholder="Username" required minlength="3" maxlength="40" autocomplete="username">
            <input type="password" name="password" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="new-password">
            <input type="text" name="name" placeholder="Full Name" required maxlength="80" autocomplete="name">
            <input type="email" name="email" placeholder="Email" required maxlength="120" autocomplete="email">
            <input type="tel" name="phone" placeholder="Phone" required minlength="8" maxlength="20" autocomplete="tel">
            <button type="submit">Create Account</button>
        </form>

        <p class="auth-link-text">Already have an account? <a href="/login">Sign in</a></p>
        <p class="auth-link-text"><a href="/">← Back to app</a></p>
    </div>
</body>
</html>
